name: V14 Grand Showroom Verified Release
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install browser
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Build
        run: npm run build
      - name: Full gameplay, save and iPhone viewport regression
        run: npm test
      - name: Commit generated release and screenshots
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html release.json sw.js manifest.webmanifest dist/ docs/screenshots/v14-*.png
          git diff --cached --check
          git commit -m "build(v14): publish larger premium showroom and screenshots"
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v14-grand-showroom-iphone-screens
          path: docs/screenshots/v14-*.png
          if-no-files-found: ignore
