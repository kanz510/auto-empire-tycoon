name: Visual V11.2 baseline screenshots
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  baseline:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node tools/visual-baseline-v11-2.cjs
      - name: Commit before screenshots and material inventory
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/screenshots/before-*.png docs/screenshots/baseline-materials-and-bounds.json
          git diff --cached --check
          git commit -m "test(visual): save before screenshots and Kenney material map"
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v11-2-baseline
          path: docs/screenshots/
