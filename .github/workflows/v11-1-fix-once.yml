name: V11.1 fix and verified release
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install test dependencies
        run: |
          npm install
          npx playwright install --with-deps chromium
      - name: Confirm red regression
        run: |
          set +e
          node tests/fix-v11-1.cjs > /tmp/red.log 2>&1
          code=$?
          set -e
          cat /tmp/red.log
          if [ "$code" -eq 0 ] || ! grep -q "Private order should include sport" /tmp/red.log; then
            echo "Expected RED assertion was not reproduced"
            exit 1
          fi
      - name: Apply three targeted source fixes
        run: |
          python .github/scripts/apply-v11-1.py
          node -e "const fs=require('fs');const p='package.json';const j=JSON.parse(fs.readFileSync(p));j.scripts.test+=' && node tests/fix-v11-1.cjs';fs.writeFileSync(p,JSON.stringify(j,null,2)+'\\n')"
      - name: Rebuild v11.1 release
        run: npm run build
      - name: Browser regression suite
        run: |
          npm install
          npx playwright install chromium
          npm test
      - name: Commit source and generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/save-state.js src/ui.js src/graphics.js tests/fix-v11-1.cjs package.json PROGRESS.md index.html release.json sw.js dist/
          git diff --cached --check
          git diff --cached --name-only
          git commit -m "fix(v11.1): reset, GLB staff tap and unlocked car orders"
          git push origin HEAD:main
