name: Generate V10 assets (temporary branch)
on:
  push:
    branches: [chatgpt/v10-licensed-glb-assets]
permissions:
  contents: write
jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python tools/build.py
      - name: Commit build outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html release.json sw.js manifest.webmanifest dist/
          if ! git diff --cached --quiet; then
            git commit -m "build(v10): refresh visual assets and framing"
            git push origin HEAD:chatgpt/v10-licensed-glb-assets
          fi
