name: V12 Living City verified release (one-time)
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Rebuild versioned city assets
        run: npm run build
      - name: Install Playwright Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Full gameplay save offline and mobile regressions
        run: npm test
      - name: Capture city screenshots on two iPhone sizes
        run: node tools/visual-screens-v12.cjs
      - name: Commit generated release and screenshots without rewriting history
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html release.json sw.js manifest.webmanifest dist/ docs/screenshots/v12-*.png docs/screenshots/v12-visual-report.json
          git diff --cached --check
          git diff --cached --stat
          git commit -m "build(v12): publish city assets and phone screenshots"
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: living-city-v12-screenshots
          path: |
            docs/screenshots/v12-*.png
            docs/screenshots/v12-visual-report.json
          if-no-files-found: ignore
