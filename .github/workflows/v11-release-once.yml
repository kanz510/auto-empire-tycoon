name: One-time V11 release build
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Generate release and precache assets
        run: python tools/build.py
      - name: Save reproducible generated artifacts on main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html release.json sw.js manifest.webmanifest dist/
          if ! git diff --cached --quiet; then
            git commit -m "build(v11): publish versioned animated character and showroom assets"
            git push origin HEAD:main
          fi
